name: CI

on:
  push:
  pull_request:

jobs:
  test-task1:
    name: task1 tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: task1/requirements.txt

      - name: Install dependencies
        run: pip install -r task1/requirements.txt

      - name: Run tests
        working-directory: task1
        run: pytest -v
